name: Build & Publish

env:
  BUILD_TYPE: Release

# Remove default permissions of GITHUB_TOKEN for security
# https://docs.github.com/en/actions/using-jobs/assigning-permissions-to-jobs
permissions: {}

on:
  push:
    paths-ignore:
      - "docfx/**"
    branches: ["main"]
    tags:
      - "v*"
  pull_request:
    branches: ["main"]

jobs:
  setup:
    runs-on: ubuntu-latest
    outputs:
      gitversion_semver: ${{ steps.gitversion.outputs.semVer }}
      gitversion_fullsemver: ${{ steps.gitversion.outputs.fullSemVer }}
      gitversion_assemblysemver: ${{ steps.gitversion.outputs.assemblySemVer }}
      gitversion_informationalversion: ${{ steps.gitversion.outputs.informationalVersion }}
    steps:
    - name: Install GitVersion
      uses: gittools/actions/gitversion/setup@v1
      with:
        versionSpec: 6.0.x

    - uses: actions/checkout@v7
      with:
        fetch-depth: 0

    - name: Execute GitVersion
      id: gitversion
      uses: gittools/actions/gitversion/execute@v1
      with:
        useConfigFile: true

  # Gamedata is edited in the data repo only (eng/gamedata/bundle.py): fail when this repo's copies drift from it,
  # generate each OS's bundled gamedata.json, and read the seq floor from the last published feed index.
  gamedata:
    runs-on: ubuntu-latest
    outputs:
      seq_floor: ${{ steps.seq_floor.outputs.seq_floor }}
    steps:
      - uses: actions/checkout@v7

      - name: Checkout the Gamedata data repo
        uses: actions/checkout@v7
        with:
          repository: ${{ vars.GAMEDATA_REPO || 'markus-wa/cssharp-gamedata' }}
          ref: ${{ vars.GAMEDATA_REF || 'main' }}
          path: gamedata-repo
          persist-credentials: false

      - name: Test
        run: python3 -m unittest discover -s eng/gamedata

      - name: Committed copies match the data repo
        run: python3 eng/gamedata/bundle.py check gamedata-repo

      - name: Generate the bundled gamedata.json per OS
        run: |
          mkdir -p bundled/linux bundled/windows
          python3 eng/gamedata/bundle.py gamedata gamedata-repo linux > bundled/linux/gamedata.json
          python3 eng/gamedata/bundle.py gamedata gamedata-repo windows > bundled/windows/gamedata.json

      # Fetched over HTTPS whatever scheme the variable names, and its seq read only once index.json.sig verifies
      # against the core's built-in keys: a forged seq would ship in the release. Any failure fails the build.
      # shortcut: no feed is published before ticket 09, so with GAMEDATA_FEED_URL unset the floor is 0 (the core's
      # default); 09 sets the variable.
      - name: Seq floor from the published index
        id: seq_floor
        env:
          GAMEDATA_FEED_URL: ${{ vars.GAMEDATA_FEED_URL }}
        run: |
          if [ -z "$GAMEDATA_FEED_URL" ]; then
            echo "::warning::GAMEDATA_FEED_URL unset (no published feed): seq floor 0"
            echo "seq_floor=0" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          feed="https://${GAMEDATA_FEED_URL#*://}"
          curl --proto '=https' -fsS --max-time 30 -o index.json "$feed/index.json"
          curl --proto '=https' -fsS --max-time 30 -o index.json.sig "$feed/index.json.sig"
          seq=$(python3 eng/gamedata/bundle.py seq-floor index.json)
          echo "seq_floor=$seq" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@v4
        with:
          name: bundled-gamedata
          path: bundled/

  build_windows:
    needs: [setup, gamedata]
    runs-on: windows-latest
    steps:
      - name: Prepare env
        shell: bash
        run: | 
          echo "GITHUB_SHA_SHORT=${GITHUB_SHA::7}" >> $GITHUB_ENV
          echo "SEMVER=${{ needs.setup.outputs.gitversion_semver }}" >> $GITHUB_ENV

      - name: Visual Studio environment
        shell: cmd
        run: |
          :: See https://github.com/microsoft/vswhere/wiki/Find-VC
          for /f "usebackq delims=*" %%i in (`vswhere -latest -property installationPath`) do (
            call "%%i"\Common7\Tools\vsdevcmd.bat -arch=x64 -host_arch=x64
          )

          :: Loop over all environment variables and make them global.
          for /f "delims== tokens=1,2" %%a in ('set') do (
            echo>>"%GITHUB_ENV%" %%a=%%b
          )

      - uses: actions/checkout@v7
        with:
          submodules: "recursive"

      - name: Build
        run: |
          mkdir -p build
          cd build
          cmake -DCMAKE_BUILD_TYPE=${{env.BUILD_TYPE}} -DCSSHARP_GAMEDATA_SEQ_FLOOR=${{ needs.gamedata.outputs.seq_floor }} ..
          cmake --build . --config ${{env.BUILD_TYPE}} -- /m:16

      - uses: actions/download-artifact@v4
        with:
          name: bundled-gamedata
          path: bundled

      - name: Clean build directory
        run: |
          cp bundled/windows/gamedata.json build/addons/counterstrikesharp/gamedata/gamedata.json
          mkdir -p build/addons/counterstrikesharp/bin/win64
          mv build/${{env.BUILD_TYPE}}/*.dll build/addons/counterstrikesharp/bin/win64
          mkdir build/output/
          mv build/addons build/output

      - uses: actions/upload-artifact@v4
        with:
          name: counterstrikesharp-windows-${{ needs.setup.outputs.gitversion_semver }}
          path: build/output/

  build_linux:
    needs: [setup, gamedata]
    runs-on: ubuntu-latest
    # Could not figure out how to run in a container only on some matrix paths, so I've split it out into its own build.
    container:
      image: registry.gitlab.steamos.cloud/steamrt/sniper/sdk:latest
    steps:
      - name: Prepare env
        shell: bash
        run: |
          echo "GITHUB_SHA_SHORT=${GITHUB_SHA::7}" >> $GITHUB_ENV
          echo "SEMVER=${{ needs.setup.outputs.gitversion_semver }}" >> $GITHUB_ENV

      - uses: actions/checkout@v7
        with:
          submodules: "recursive"

      - name: Build
        run: |
          mkdir -p build
          cd build
          cmake -G Ninja -DCMAKE_BUILD_TYPE=${{env.BUILD_TYPE}} -DCSSHARP_GAMEDATA_SEQ_FLOOR=${{ needs.gamedata.outputs.seq_floor }} ..
          cmake --build . --config ${{env.BUILD_TYPE}} -- -j16

      - name: Native tests
        run: |
          cmake -S tests/native -B build-tests -G Ninja -DCMAKE_BUILD_TYPE=${{env.BUILD_TYPE}}
          cmake --build build-tests -- -j16
          cd build-tests
          ctest --output-on-failure

      - uses: actions/download-artifact@v4
        with:
          name: bundled-gamedata
          path: bundled

      - name: Clean build directory
        run: |
          cp bundled/linux/gamedata.json build/addons/counterstrikesharp/gamedata/gamedata.json
          mkdir build/output/
          mv build/addons build/output

      - uses: actions/upload-artifact@v4
        with:
          name: counterstrikesharp-linux-${{ needs.setup.outputs.gitversion_semver }}
          path: build/output/

  build_managed:
    needs: setup
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - name: Prepare env
        shell: bash
        run: echo "GITHUB_SHA_SHORT=${GITHUB_SHA::7}" >> $GITHUB_ENV

      # We don't need expensive submodules for the managed side.
      - uses: actions/checkout@v7

      - name: Build runtime v${{ needs.setup.outputs.gitversion_semver }}
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Install dependencies
        run: dotnet restore managed/CounterStrikeSharp.sln

      - name: Run tests
        run: dotnet test --logger trx --results-directory "TestResults-${{ needs.setup.outputs.gitversion_semver }}" managed/CounterStrikeSharp.API.Tests/CounterStrikeSharp.API.Tests.csproj

      - name: Upload dotnet test results
        uses: actions/upload-artifact@v4
        with:
          name: test-results-${{ needs.setup.outputs.gitversion_semver }}
          path: TestResults-${{ needs.setup.outputs.gitversion_semver }}
        if: ${{ always() }}

      - name: Publish artifacts
        run: |
          dotnet publish -c Release \
          /p:Version=${{ needs.setup.outputs.gitversion_semver }} \
          /p:AssemblyVersion=${{ needs.setup.outputs.gitversion_assemblySemver }} \
          /p:InformationalVersion=${{ needs.setup.outputs.gitversion_informationalversion }} \
          managed/CounterStrikeSharp.API
          
          dotnet pack -c Release \
          /p:Version=${{ needs.setup.outputs.gitversion_semver }} \
          /p:AssemblyVersion=${{ needs.setup.outputs.gitversion_assemblySemver }} \
          /p:InformationalVersion=${{ needs.setup.outputs.gitversion_informationalversion }} \
          managed/CounterStrikeSharp.API

      - uses: actions/upload-artifact@v4
        with:
          name: counterstrikesharp-api-${{ needs.setup.outputs.gitversion_semver }}
          path: managed/CounterStrikeSharp.API/bin/Release

  publish:
    if: ${{ github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v') && github.repository == 'roflmuffin/CounterStrikeSharp' }}
    permissions:
      contents: write
    needs: ["setup", "build_linux", "build_windows", "build_managed"]
    runs-on: ubuntu-latest
    steps:
      - name: Prepare env
        shell: bash
        run: echo "GITHUB_SHA_SHORT=${GITHUB_SHA::7}" >> $GITHUB_ENV

      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/download-artifact@v4
        with:
          name: counterstrikesharp-windows-${{ needs.setup.outputs.gitversion_semver }}
          path: build/windows

      - uses: actions/download-artifact@v4
        with:
          name: counterstrikesharp-linux-${{ needs.setup.outputs.gitversion_semver }}
          path: build/linux

      - uses: actions/download-artifact@v4
        with:
          name: counterstrikesharp-api-${{ needs.setup.outputs.gitversion_semver }}
          path: build/api

      # TODO: This stuff should really be in a matrix
      - name: Add API to Artifacts
        run: |
          mkdir -p build/linux/addons/counterstrikesharp/api
          mkdir -p build/windows/addons/counterstrikesharp/api
          cp -r build/api/net10.0/publish/* build/linux/addons/counterstrikesharp/api
          cp -r build/api/net10.0/publish/* build/windows/addons/counterstrikesharp/api

      - name: Zip Builds
        run: |
          (cd build/linux && zip -qq -r ../../counterstrikesharp-linux-${{ needs.setup.outputs.gitversion_semver }}.zip *)
          (cd build/windows && zip -qq -r ../../counterstrikesharp-windows-${{ needs.setup.outputs.gitversion_semver }}.zip *)

      - name: Add dotnet runtime
        run: |
          mkdir -p build/linux/addons/counterstrikesharp/dotnet
          curl -s -L https://builds.dotnet.microsoft.com/dotnet/aspnetcore/Runtime/10.0.3/aspnetcore-runtime-10.0.3-linux-x64.tar.gz \
          | tar xvz -C build/linux/addons/counterstrikesharp/dotnet

          mkdir -p build/windows/addons/counterstrikesharp/dotnet
          curl -s -L https://builds.dotnet.microsoft.com/dotnet/aspnetcore/Runtime/10.0.3/aspnetcore-runtime-10.0.3-win-x64.zip -o dotnet.zip
          unzip -qq dotnet.zip -d build/windows/addons/counterstrikesharp/dotnet

      - name: Zip Builds
        run: |
          (cd build/linux && zip -qq -r ../../counterstrikesharp-with-runtime-linux-${{ needs.setup.outputs.gitversion_semver }}.zip *)
          (cd build/windows && zip -qq -r ../../counterstrikesharp-with-runtime-windows-${{ needs.setup.outputs.gitversion_semver }}.zip *)
      
      - name: Generate a changelog
        uses: orhun/git-cliff-action@v4
        id: git-cliff
        with:
            config: cliff.toml
            args: --current -s footer

      - name: Release
        id: release
        uses: softprops/action-gh-release@v1
        with:
          append_body: true
          body: |
            ${{ steps.git-cliff.outputs.content }}

            Please refer to [CHANGELOG.md](https://github.com/roflmuffin/CounterStrikeSharp/blob/${{ github.ref_name }}/CHANGELOG.md) for details.
          files: |
            counterstrikesharp-windows-${{ needs.setup.outputs.gitversion_semver }}.zip
            counterstrikesharp-with-runtime-windows-${{ needs.setup.outputs.gitversion_semver }}.zip
            counterstrikesharp-linux-${{ needs.setup.outputs.gitversion_semver }}.zip
            counterstrikesharp-with-runtime-linux-${{ needs.setup.outputs.gitversion_semver }}.zip

      - name: Publish NuGet package
        run: |
          dotnet nuget push build/api/CounterStrikeSharp.API.${{ needs.setup.outputs.gitversion_semver }}.nupkg --api-key ${{ secrets.NUGET_API_KEY }} --source https://api.nuget.org/v3/index.json --skip-duplicate
          dotnet nuget push build/api/CounterStrikeSharp.API.${{ needs.setup.outputs.gitversion_semver }}.snupkg --api-key ${{ secrets.NUGET_API_KEY }} --source https://api.nuget.org/v3/index.json --skip-duplicate

      - name: Send Notification to Discord
        if: ${{ !contains(github.ref_name, '-alpha') && !contains(github.ref_name, '-beta') && !contains(github.ref_name, '-rc') }}
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
        uses: Ilshidur/action-discord@0.3.2
        with:
          args: |
            A new release of CS# has been tagged [v${{ needs.setup.outputs.gitversion_semver }}](${{ steps.release.outputs.url }})

            ${{ steps.git-cliff.outputs.content }}

            Please refer to [CHANGELOG.md](https://github.com/roflmuffin/CounterStrikeSharp/blob/${{ github.ref_name }}/CHANGELOG.md) for details.
